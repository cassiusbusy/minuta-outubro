<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artigo por Artigo</title>
<meta http-equiv="refresh" content="0; url=comparativo.html">
<script>
  // "O que mudou" agora faz parte de "Artigo por artigo": leva os filtros do link antigo para a página nova
  // "Artigo por artigo" está escondida nesta fase: enquanto OCULTA = true, o link antigo leva ao Comparativo visual
  var OCULTA = true;
  (function () {
    if (OCULTA) { location.replace('comparativo.html'); return; }
    var p = new URLSearchParams(location.search), n = new URLSearchParams();
    n.set('aba', 'jul');
    if (p.get('q')) n.set('q', p.get('q'));
    if (p.get('onde') && p.get('onde') !== 'tudo') n.set('onde', p.get('onde'));
    if (p.get('lugar') === '1') n.set('lugar', '1');
    if (p.get('ordem') === 'mudanca') n.set('ordem', 'mudanca');
    if (p.get('sit')) n.set('sj', p.get('sit'));
    if (p.get('grau')) n.set('grau', p.get('grau'));
    var t = (p.get('titulo') || '').match(/^T[ÍI]TULO\s+([IVXLC]+)/i); if (t) n.set('tit', t[1]);
    location.replace('artigos.html?' + n.toString());
  })();
</script>
</head>
<body><p>Esta página foi substituída. Veja o <a href="comparativo.html">Comparativo visual</a>.</p></body>
</html>
