<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artigo por Artigo</title>
<meta http-equiv="refresh" content="0; url=artigos.html">
<script>
  // "Lei de 2015 × nova" agora faz parte de "Artigo por artigo": leva os filtros do link antigo para a página nova
  (function () {
    var p = new URLSearchParams(location.search), n = new URLSearchParams();
    var ant = p.get('g') === 'antigos';
    if (ant) n.set('g', 'antigos');
    if (p.get('q')) n.set('q', p.get('q'));
    if (p.get('sit')) n.set(ant ? 'sa' : 's15', p.get('sit'));
    if (!ant) {
      if (p.get('tipo')) n.set('tipo', p.get('tipo'));
      if (p.get('imp')) n.set('imp', p.get('imp'));
      if (p.get('outros') === '1') n.set('outros', '1');
      if (p.get('ordem') === 'contra') n.set('ordem', 'contra');
    }
    if (p.get('titulo')) { if (ant) n.set('titulo', p.get('titulo')); else { var t = p.get('titulo').match(/^T[ÍI]TULO\s+([IVXLC]+)/i); if (t) n.set('tit', t[1]); } }
    location.replace('artigos.html' + (n.toString() ? '?' + n.toString() : ''));
  })();
</script>
</head>
<body><p>Esta página agora faz parte de <a href="artigos.html">Artigo por artigo</a>.</p></body>
</html>
